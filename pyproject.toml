[project]
name = "translation-studio"
version = "0.1.0"
description = "Production-grade Structure-Preserving Document Translation Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0,<0.120.0",
    "uvicorn[standard]>=0.28.0,<0.35.0",
    "pydantic>=2.6.0,<3.0.0",
    "pydantic-settings>=2.2.0,<3.0.0",
    "pymupdf>=1.24.0,<2.0.0",
    "pillow>=10.2.0,<12.0.0",
    "reportlab>=4.1.0,<5.0.0",
    "uharfbuzz>=0.39.0,<1.0.0",
    "httpx>=0.27.0,<0.30.0",
    "sqlalchemy[asyncio]>=2.0.28,<3.0.0",
    "asyncpg>=0.29.0,<1.0.0",
    "aiosqlite>=0.20.0,<1.0.0",
    "alembic>=1.13.0,<2.0.0",
    "redis>=5.0.3,<6.0.0",
    "celery>=5.3.6,<6.0.0",
    "pyyaml>=6.0.1,<7.0.0",
    "structlog>=24.1.0,<25.0.0",
    "python-multipart>=0.0.9,<0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "locust>=2.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["packages", "apps"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
