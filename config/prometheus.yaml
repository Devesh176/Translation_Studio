global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: local
    environment: development

rule_files: []

alerting:
  alertmanagers: []

scrape_configs:
  # Translation Studio API — application Prometheus metrics (/metrics)
  - job_name: translation-studio-api
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: translation-studio-api
    metrics_path: /metrics
    scrape_interval: 15s

  # OTel Collector — metrics forwarded from the SDK via OTLP
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
        labels:
          service: otel-collector
    scrape_interval: 15s

  # Prometheus self-scrape
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
